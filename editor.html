"oneSentenceSummary": "Santorini is a volcanic Greek island famous for its caldera, cliff villages and blue Aegean views.",
"childFriendlySummary": "Santorini is not just a pretty island; it is a geography lesson shaped by volcanoes. The island group sits in the southern Aegean Sea and has steep cliffs around a giant sea-filled caldera, with villages such as Fira and Oia looking out across the water.",
"whyItMatters": "It matters because Santorini shows how volcanoes can change the shape of land and create one of the world’s most recognisable island landscapes.",
"sebConnection": "Seb’s almanac records this as a planned August 2026 Sun Princess cruise stop with Mummy and Daddy, so it should stay as a future visit until the trip happens.",
"geographyFacts": [
"Santorini is part of the Cyclades island group in Greece.",
"The island is built around a caldera, which is a large volcanic hollow partly filled by the sea."
],
"historyFacts": [
"Santorini was known in ancient times as Thira or Thera.",
"The Bronze Age settlement of Akrotiri is famous because volcanic ash helped preserve parts of the ancient town."
],
"numberFacts": [
"Visit Greece describes Fira as about 260 metres above sea level on the edge of the caldera.",
"Santorini lies about 200 kilometres south-east of mainland Greece."

<script>
const EMBEDDED_BACKUP = JSON.parse(document.getElementById('embeddedData').textContent);
const STORAGE_KEY = 'seb-adventure-almanac-master-editor-working-copy-v1';
const SECTIONS = [
  ['dashboard','Dashboard','⌂'],
  ['anomalies','Anomalies','⚠'],
  ['places','Places','📍'],
  ['travel','Travel events','🧳'],
  ['flights','Flights','✈'],
  ['raw','Raw JSON','{}'],
  ['help','Help','?']
];
const PLACE_TYPES = ['airport','capital','city','continent','country','county','cruise_ship','hotel_resort','landmark','port_cruise_stop','state_region','theme_park','tourist_attraction','town','village'];
const PLACE_STATUS = ['known','candidate','needs_review','archived'];
const VISIT_STATUS = ['completed','planned','cancelled','context_only','needs_review'];
const EVENT_STATUS = ['completed','planned','cancelled','draft'];
const EVENT_CATEGORIES = ['short_break','staycation','vacation','cruise','planned_vacation'];
const TRIP_TYPES = ['single_stay','multi_centre','self_catering','holiday_village','fly_cruise','ex_uk_cruise','open_jaw_cruise','fly_and_stay','not_applicable'];
const FLIGHT_DIRECTIONS = ['outbound','return','internal','connecting','unknown'];
const FLIGHT_CONFIDENCE = ['parent_confirmed','needs_details','educated_guess','not_recorded'];

let db = loadInitial();
let currentSection = 'anomalies';
let selected = {places:null, travel:null, flights:null};
let filters = {places:{q:'',type:'',issue:''}, travel:{q:'',status:'',issue:''}, flights:{q:'',confidence:'',issue:''}, anomalies:{q:'',severity:'',type:''}};
let rawSelected = {places:'', travel:'', flights:''};
let issues = [];
let dirty = false;

function loadInitial(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved) return JSON.parse(saved);
  }catch(e){ console.warn(e); }
  return clone(EMBEDDED_BACKUP);
}
function clone(x){ return JSON.parse(JSON.stringify(x)); }
function $(id){ return document.getElementById(id); }
function esc(v){ return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(v){ return String(v ?? '').trim().toLowerCase().replace(/\s+/g,' '); }
function isoNow(){ return new Date().toISOString(); }
function markDirty(msg){
  dirty = true;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }catch(e){ console.warn('Local save failed', e); }
  if(msg) toast(msg);
  render();
}
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('active');
  clearTimeout(window.__toastTimer); window.__toastTimer=setTimeout(()=>t.classList.remove('active'), 3200);
}
function showSection(id){
  currentSection=id;
  document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active', s.id===id));
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.section===id));
  if(window.innerWidth<1050) $('sidebar').classList.remove('open');
  render();
}
function countIssues(recordType, id){ return issues.filter(i=>i.recordType===recordType && i.id===id).length; }
function countIssuesByRecord(recordType){
  const m={};
  issues.forEach(i=>{ if(i.recordType===recordType && i.id) m[i.id]=(m[i.id]||0)+1; });
  return m;
}
function linesToArray(s){ return String(s ?? '').split(/\r?\n/).map(x=>x.trim()).filter(Boolean); }
function arrayToLines(a){ return Array.isArray(a) ? a.join('\n') : ''; }
function parseBool(v){ return v === true || v === 'true' || v === 'on' || v === '1'; }
function legacyFromTripContext(s){ const m=String(s||'').match(/\bTL-\d{3}\b/); return m ? m[0] : ''; }
function labelForIndex(i){ return ['First visit','Second visit','Third visit','Fourth visit','Fifth visit','Sixth visit','Seventh visit','Eighth visit','Ninth visit','Tenth visit'][i] || `${i+1}th visit`; }
function eventByLegacy(){
  const m={}; (db.travelEvents||[]).forEach(e=>{ if(e.legacyId) m[e.legacyId]=e; }); return m;
}
function eventById(){
  const m={}; (db.travelEvents||[]).forEach(e=>{ if(e.id) m[e.id]=e; }); return m;
}
function allTravelLegacyIds(){ return (db.travelEvents||[]).map(e=>e.legacyId).filter(Boolean); }

function scanIssues(){
  const out=[];
  const eByLegacy = eventByLegacy();
  const eById = eventById();

  const canonicalGroups={};
  (db.places||[]).forEach(p=>{
    const key=norm(p.canonicalKey || p.canonicalName || p.displayName);
    if(key){ (canonicalGroups[key] ||= []).push(p); }

    const vcs = Array.isArray(p.visitContexts) ? p.visitContexts : [];
    const groups={};
    vcs.forEach(vc=>{
      const k=[norm(vc.visitDateApprox), norm(vc.tripContext), norm(vc.status)].join('|');
      (groups[k] ||= []).push(vc);
    });
    Object.entries(groups).forEach(([k,arr])=>{
      if(arr.length>1 && k !== '||'){
        out.push({severity:'high', type:'duplicate_visit_contexts', recordType:'places', id:p.id, title:p.displayName||p.canonicalName||p.id, detail:`${arr.length} visit contexts share the same month, trip context and status. This is the main duplicated-month problem.`, action:'dedupe_place_visits'});
      }
    });

    vcs.forEach(vc=>{
      const legacy = legacyFromTripContext(vc.tripContext);
      const ev = legacy ? eByLegacy[legacy] : null;
      const looksPlanned = /planned future trip/i.test(String(vc.notes||'') + ' ' + String(p.notesForReview||''));
      if(((ev && ev.status === 'planned') || looksPlanned) && vc.status === 'completed'){
        out.push({severity:'high', type:'planned_marked_completed', recordType:'places', id:p.id, title:p.displayName||p.id, detail:`Visit context "${vc.visitLabel || vc.visitId}" appears to belong to a planned trip but is marked completed.`, visitId:vc.visitId, action:'set_place_planned_status'});
      }
    });

    const sourceIds = Array.isArray(p.sourceTravelEventIds) ? p.sourceTravelEventIds : [];
    const sourceLegacy = Array.isArray(p.sourceLegacyIds) ? p.sourceLegacyIds : [];
    const mappedLegacy = sourceIds.map(id=>eById[id]?.legacyId).filter(Boolean);
    if(sourceIds.length && sourceLegacy.length && setKey(mappedLegacy) !== setKey(sourceLegacy)){
      out.push({severity:'medium', type:'source_link_mismatch', recordType:'places', id:p.id, title:p.displayName||p.id, detail:`sourceTravelEventIds resolve to [${mappedLegacy.join(', ') || 'none'}], but sourceLegacyIds contains [${sourceLegacy.join(', ')}].`, action:'open_record'});
    }

    if(p.placeType === 'airport' && !p.iataCode){
      const aliasCodes = (p.aliases||[]).map(a=>String(a).trim()).filter(a=>/^[A-Z]{3}$/.test(a));
      if(aliasCodes.length){
        out.push({severity:'low', type:'airport_iata_missing', recordType:'places', id:p.id, title:p.displayName||p.id, detail:`Airport has no iataCode field but aliases include ${aliasCodes.join(', ')}.`, action:'infer_iata'});
      }
    }

    if(vcs.length===1 && !vcs[0].tripContext && !vcs[0].visitDateApprox && vcs[0].status==='completed' && !sourceLegacy.length){
      const text = String(p.almanac?.sebConnection || '') + ' ' + String(p.notes || '');
      if(/hierarchy|not because it adds a separate personal memory/i.test(text) || ['country','county','state_region','continent','town','village','capital'].includes(p.placeType)){
        out.push({severity:'low', type:'hierarchy_record_has_visit', recordType:'places', id:p.id, title:p.displayName||p.id, detail:'This looks like a hierarchy/context record but has a synthetic completed visit context for Seb.', action:'open_record'});
      }
    }
  });

  Object.values(canonicalGroups).forEach(arr=>{
    if(arr.length>1){
      arr.forEach(p=>out.push({severity:'medium', type:'duplicate_canonical_key', recordType:'places', id:p.id, title:p.displayName||p.id, detail:`Canonical key is shared with: ${arr.filter(x=>x.id!==p.id).map(x=>x.displayName||x.id).join(', ')}.`, action:'open_record'}));
    }
  });

  (db.travelEvents||[]).forEach(e=>{
    const expected = e.legacyId ? `travel_${e.legacyId}` : '';
    if(expected && /^travel_TL-\d{3}$/.test(e.id||'') && e.id !== expected){
      out.push({severity:'medium', type:'travel_id_legacy_drift', recordType:'travel', id:e.id, title:e.title||e.id, detail:`Event id is ${e.id}, but legacyId is ${e.legacyId}. This may be harmless, but it makes hand-editing references harder.`, action:'open_record'});
    }
    if(e.outboundFlightId && !(db.flightSegments||[]).some(f=>f.id===e.outboundFlightId)){
      out.push({severity:'medium', type:'missing_outbound_flight', recordType:'travel', id:e.id, title:e.title||e.id, detail:`Outbound flight id ${e.outboundFlightId} does not exist.`, action:'open_record'});
    }
    if(e.returnFlightId && !(db.flightSegments||[]).some(f=>f.id===e.returnFlightId)){
      out.push({severity:'medium', type:'missing_return_flight', recordType:'travel', id:e.id, title:e.title||e.id, detail:`Return flight id ${e.returnFlightId} does not exist.`, action:'open_record'});
    }
    if(e.status === 'planned' && e.category !== 'planned_vacation' && !['cruise','short_break','vacation'].includes(e.category)){
      out.push({severity:'low', type:'planned_category_review', recordType:'travel', id:e.id, title:e.title||e.id, detail:`Planned event uses category "${e.category}". Check whether this is intentional.`, action:'open_record'});
    }
  });

  (db.flightSegments||[]).forEach(f=>{
    if(f.linkedTravelEventId && !eById[f.linkedTravelEventId]){
      out.push({severity:'high', type:'flight_missing_travel_event', recordType:'flights', id:f.id, title:f.id, detail:`Flight points to missing travel event ${f.linkedTravelEventId}.`, action:'open_record'});
    }
    if(f.confidence === 'needs_details'){
      out.push({severity:'low', type:'flight_needs_details', recordType:'flights', id:f.id, title:`${f.fromIata||f.fromAirport} → ${f.toIata||f.toAirport}`, detail:'Flight is still marked needs_details.', action:'open_record'});
    }
    ['fromIata','toIata'].forEach(field=>{
      if(f[field] && !/^[A-Z]{3}$/.test(f[field])){
        out.push({severity:'medium', type:'iata_format', recordType:'flights', id:f.id, title:f.id, detail:`${field} is "${f[field]}", not a three-letter uppercase IATA code.`, action:'open_record'});
      }
    });
  });

  return out;
}

function filteredRecords(kind){
  const map = {places:db.places||[], travel:db.travelEvents||[], flights:db.flightSegments||[]};

  return map[kind].filter(r=>{

function renderRaw(){
  $('raw').innerHTML = `<div class="hero"><div class="eyebrow">Full backup</div><h2>Raw JSON editor</h2><p>Validate or directly edit the entire working backup. Use this carefully; it replaces the full working copy.</p></div>

    <textarea id="rawBackup" class="rawarea">${esc(JSON.stringify(db,null,2))}</textarea></div>`;
}
function validateRaw(){
  try{ JSON.parse($('rawBackup').value); toast('Raw JSON is valid.'); }catch(e){ toast('Invalid JSON: '+e.message); }
}
function applyRawBackup(){
  try{
    const parsed=JSON.parse($('rawBackup').value);
    if(!Array.isArray(parsed.places) || !Array.isArray(parsed.travelEvents) || !Array.isArray(parsed.flightSegments)) {
      toast('Valid JSON, but it is not a recognised Almanac backup shape.');
      return;
    }
    db=parsed; selected={places:null,travel:null,flights:null}; markDirty('Full raw backup applied'); showSection('anomalies');
  }catch(e){ toast('Invalid JSON: '+e.message); }
}
function copyRaw(){
  const text=JSON.stringify(db,null,2);
  navigator.clipboard?.writeText(text).then(()=>toast('JSON copied to clipboard.')).catch(()=>toast('Clipboard not available. Use manual select/copy.'));
}
function renderHelp(){
  $('help').innerHTML = `<div class="hero"><div class="eyebrow">Operating notes</div><h2>How to use this editor safely</h2><p>The editor is designed for diagnosis and repair of a backup JSON file, not live mutation of the browser IndexedDB used by the Almanac.</p></div>
  <div class="grid cols2">
    <div class="card"><h3>Safe first fixes</h3><p>Duplicate visit contexts are identified by matching month, trip context and status. The de-duplication action keeps the richest-looking record, merges traveller names and merges notes.</p><p>Planned-context repair only changes visit contexts that clearly reference a planned travel event or contain planned-future wording.</p></div>
    <div class="card"><h3>Export and re-import</h3><p>After edits, use <strong>Download corrected backup</strong>. Keep the original backup untouched. Re-import the corrected copy into the Almanac only after the anomaly count and spot checks look right.</p></div>
    <div class="card"><h3>What the anomaly scan does not know</h3><p>It cannot know whether a family memory is true. It flags structural risk: duplicate contexts, planned/completed conflicts, suspicious source links, missing IATA codes and records that look like hierarchy layers rather than visited places.</p></div>
    <div class="card"><h3>Local storage</h3><p>Edits are auto-saved into this browser’s local storage. Use <strong>Reset to embedded</strong> to return to the backup embedded in this HTML file.</p></div>
  </div>`;
}

function relabelVisits(p){ (p.visitContexts||[]).forEach((vc,i)=>{ vc.visitLabel=labelForIndex(i); }); }
function relabelPlaceVisits(id){ const p=(db.places||[]).find(x=>x.id===id); if(!p) return; relabelVisits(p); p.updatedAt=isoNow(); markDirty('Visit labels rebuilt'); }
function relabelAllVisits(){ (db.places||[]).forEach(p=>{ relabelVisits(p); p.updatedAt=isoNow(); }); markDirty('All visit labels rebuilt'); }
function dedupePlaceVisitContexts(id){
  const p=(db.places||[]).find(x=>x.id===id); if(!p || !Array.isArray(p.visitContexts)) return;
  const before=p.visitContexts.length;
  p.visitContexts = dedupeVisitArray(p.visitContexts);
  relabelVisits(p); p.visitedBy = unionArrays([p.visitedBy||[], ...p.visitContexts.map(vc=>vc.visitedBy||[])]);
  p.updatedAt=isoNow();
  const removed=before-p.visitContexts.length;
  markDirty(removed ? `Removed ${removed} duplicate visit context(s).` : 'No duplicate visit contexts removed.');
}
function dedupeVisitArray(vcs){
  const groups={};
  vcs.forEach(vc=>{
    const k=[norm(vc.visitDateApprox), norm(vc.tripContext), norm(vc.status)].join('|');
    (groups[k] ||= []).push(vc);
  });
  const result=[];
  Object.values(groups).forEach(arr=>{
    if(arr.length===1 || [norm(arr[0].visitDateApprox),norm(arr[0].tripContext),norm(arr[0].status)].join('|')==='||') { result.push(...arr); return; }
    const sorted=[...arr].sort((a,b)=>scoreVisit(b)-scoreVisit(a));
    const keep=clone(sorted[0]);
    keep.visitedBy = unionArrays(arr.map(x=>x.visitedBy||[]));
    const notes=[...new Set(arr.map(x=>String(x.notes||'').trim()).filter(Boolean))];
    if(notes.length) keep.notes=notes.join(' | ');
    result.push(keep);
  });
  return result;
}
function scoreVisit(vc){ return (String(vc.visitId||'').includes('_tl_')?1000:0) + (Array.isArray(vc.visitedBy)?vc.visitedBy.length*20:0) + String(vc.notes||'').length + String(vc.tripContext||'').length; }
function unionArrays(arrays){ return [...new Set((arrays||[]).flat().map(x=>String(x).trim()).filter(Boolean))]; }
function dedupeAllVisitContexts(){
  if(!confirm('De-duplicate all exact duplicate visit contexts across all place records?')) return;
  let removed=0;
  (db.places||[]).forEach(p=>{
    if(!Array.isArray(p.visitContexts)) return;
    const before=p.visitContexts.length; p.visitContexts=dedupeVisitArray(p.visitContexts); removed += before-p.visitContexts.length; relabelVisits(p); p.visitedBy=unionArrays([p.visitedBy||[], ...p.visitContexts.map(vc=>vc.visitedBy||[])]); p.updatedAt=isoNow();
  });
  markDirty(`Removed ${removed} duplicate visit context(s) across all places.`);
}
function setPlacePlannedStatuses(id){
  const p=(db.places||[]).find(x=>x.id===id); if(!p) return;
  const eByLegacy=eventByLegacy(); let changed=0;
  (p.visitContexts||[]).forEach(vc=>{
    const legacy=legacyFromTripContext(vc.tripContext);
    const ev=legacy?eByLegacy[legacy]:null;
    const looksPlanned=/planned future trip/i.test(String(vc.notes||'')+' '+String((p.notesForReview||[]).join(' ')));
    if(((ev&&ev.status==='planned')||looksPlanned) && vc.status!=='planned'){ vc.status='planned'; changed++; }
  });
  p.updatedAt=isoNow(); markDirty(`Updated ${changed} visit context status value(s).`);
}
function setAllPlannedContextStatuses(){
  if(!confirm('Set visit contexts that clearly belong to planned travel events to planned?')) return;
  let changed=0; const eByLegacy=eventByLegacy();
  (db.places||[]).forEach(p=>{
    (p.visitContexts||[]).forEach(vc=>{
      const legacy=legacyFromTripContext(vc.tripContext);
      const ev=legacy?eByLegacy[legacy]:null;
      const looksPlanned=/planned future trip/i.test(String(vc.notes||'')+' '+String((p.notesForReview||[]).join(' ')));
      if(((ev&&ev.status==='planned')||looksPlanned) && vc.status!=='planned'){ vc.status='planned'; changed++; p.updatedAt=isoNow(); }
    });
  });
  markDirty(`Updated ${changed} planned visit context status value(s).`);
}
function inferPlaceIata(id){
  const p=(db.places||[]).find(x=>x.id===id); if(!p) return;
  const code=(p.aliases||[]).map(a=>String(a).trim()).find(a=>/^[A-Z]{3}$/.test(a));
  if(code){ p.iataCode=code; p.updatedAt=isoNow(); markDirty(`Set IATA code to ${code}.`); } else toast('No three-letter IATA alias found.');
}

function deleteRecord(kind,id){
  if(!confirm(`Delete ${kind} record ${id}?`)) return;
  const arr=kind==='places'?db.places:kind==='travel'?db.travelEvents:db.flightSegments;
  const ix=arr.findIndex(x=>x.id===id); if(ix<0) return;
  arr.splice(ix,1); selected[kind]=null; markDirty('Record deleted');
}
function downloadRecord(kind,id){
  const arr=kind==='places'?db.places:kind==='travel'?db.travelEvents:db.flightSegments;
  const obj=arr.find(x=>x.id===id); if(!obj) return;
  downloadJson(obj, `seb-almanac-${kind}-${safeFile(id)}.json`);
}
function safeFile(s){ return String(s||'record').replace(/[^a-z0-9_-]+/gi,'-').toLowerCase(); }
function downloadBackup(){
  const out=clone(db); out.exportedAt=isoNow(); downloadJson(out, `seb-adventure-almanac-corrected-backup-${new Date().toISOString().slice(0,10)}.json`);
}
function downloadJson(obj,filename){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function saveLocalCopy(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); toast('Working copy saved locally in this browser.'); }
function clearLocalCopy(){
  if(!confirm('Reset this editor back to the embedded backup and discard local working-copy edits?')) return;
  localStorage.removeItem(STORAGE_KEY); db=clone(EMBEDDED_BACKUP); selected={places:null,travel:null,flights:null}; dirty=false; toast('Reset to embedded backup.'); render();
}
function openImportModal(){
  $('modalTitle').textContent='Import backup JSON';
  $('modalBody').innerHTML = `<div class="notice warn">Importing replaces the current working copy in this editor. Export first if you want to keep current edits.</div>
    <label>Choose JSON file</label><input type="file" accept="application/json,.json" onchange="importFile(this.files[0])">
    <label style="margin-top:14px">Or paste JSON</label><textarea id="pasteImport" class="rawarea" placeholder="Paste backup JSON here"></textarea>
    <div class="toolbar"><button class="button primary" onclick="importPasted()">Import pasted JSON</button></div>`;
  $('modalBack').classList.add('active');
}
function closeModal(){ $('modalBack').classList.remove('active'); }
function importFile(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>importJsonText(reader.result);
  reader.readAsText(file);
}
function importPasted(){ importJsonText($('pasteImport').value); }
function importJsonText(text){
  try{
    const parsed=JSON.parse(text);
    if(!Array.isArray(parsed.places)||!Array.isArray(parsed.travelEvents)||!Array.isArray(parsed.flightSegments)){ toast('Valid JSON, but not recognised as an Almanac backup.'); return; }
    db=parsed; selected={places:null,travel:null,flights:null}; saveLocalCopy(); closeModal(); showSection('anomalies'); toast('Backup imported into the editor working copy.');
  }catch(e){ toast('Invalid JSON: '+e.message); }
}

$('mobileToggle').addEventListener('click',()=>$('sidebar').classList.toggle('open'));
$('modalBack').addEventListener('click',e=>{ if(e.target.id==='modalBack') closeModal(); });
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); saveLocalCopy(); }
});
render();
showSection(currentSection);
</script>
